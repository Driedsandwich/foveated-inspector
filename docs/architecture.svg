<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>Foveated Inspector — OpenCV 5 on AWS architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.6;rx:10}
      .aws{fill:#fff7ed;stroke:#c2410c}
      .cv{fill:#eef2ff;stroke:#4338ca}
      .store{fill:#f0fdf4;stroke:#15803d}
      .t{font-weight:700;font-size:16px}
      .s{font-size:13px;fill:#334155}
      .ln{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dash{stroke-dasharray:6 5}
      .grp{fill:none;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:4 4;rx:14}
      .gt{font-size:13px;fill:#64748b;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="40" y="44" font-size="22" font-weight="700">Foveated Inspector — architecture</text>
  <text x="40" y="68" class="s">Budget-aware active inspection: a coarse look, then OpenCV 5 analysis only where the evidence says to zoom.</text>

  <!-- Public path -->
  <rect x="40" y="110" width="170" height="78" class="box"/>
  <text x="58" y="140" class="t">Judge / inspector</text>
  <text x="58" y="162" class="s">browser UI (replay,</text>
  <text x="58" y="178" class="s">human-review buttons)</text>

  <rect x="270" y="110" width="200" height="78" class="box aws"/>
  <text x="288" y="140" class="t">API Gateway HTTP API</text>
  <text x="288" y="162" class="s">6 routes · throttled</text>
  <text x="288" y="178" class="s">1 req/s, burst 2 per route</text>

  <rect x="530" y="110" width="210" height="78" class="box aws"/>
  <text x="548" y="140" class="t">Lambda x132-web</text>
  <text x="548" y="162" class="s">arm64 · 256 MB · no OpenCV</text>
  <text x="548" y="178" class="s">validation, per-IP &amp; daily caps</text>

  <rect x="800" y="100" width="250" height="98" class="box cv"/>
  <text x="818" y="130" class="t">Lambda x132-inspect</text>
  <text x="818" y="152" class="s">arm64 (Graviton) · 3008 MB</text>
  <text x="818" y="170" class="s">OpenCV 5 layer + cv2.ml models</text>
  <text x="818" y="188" class="s">agent loop: coarse → zoom → confirm</text>

  <path d="M210 149 H262" class="ln"/>
  <path d="M470 149 H522" class="ln"/>
  <path d="M740 149 H792" class="ln"/>

  <!-- Agent loop detail -->
  <rect x="800" y="232" width="350" height="200" class="grp"/>
  <text x="814" y="254" class="gt">Agent (deterministic, logged)</text>
  <text x="814" y="280" class="s">1. coarse_scan (¼ res) → belief map</text>
  <text x="814" y="302" class="s">2. confirm candidates first, else best weighted belief / cost</text>
  <text x="814" y="324" class="s">3. inspect_tile → OpenCV 5 features → cv2.ml RTrees</text>
  <text x="814" y="346" class="s">4. evidence decides next action:</text>
  <text x="834" y="368" class="s">escalate zoom · follow crack to neighbour</text>
  <text x="834" y="390" class="s">report (confirmed at full res) · ask a human</text>
  <text x="814" y="414" class="s">5. stop at pixel budget; every step in a JSON trace</text>
  <path d="M925 198 V224" class="ln dash"/>

  <!-- Storage -->
  <rect x="270" y="300" width="200" height="88" class="box store"/>
  <text x="288" y="330" class="t">Amazon S3</text>
  <text x="288" y="352" class="s">surfaces, benchmark, models,</text>
  <text x="288" y="370" class="s">traces, overlays (private)</text>

  <rect x="530" y="300" width="210" height="88" class="box store"/>
  <text x="548" y="330" class="t">Amazon DynamoDB</text>
  <text x="548" y="352" class="s">inspections, human reviews,</text>
  <text x="548" y="370" class="s">rate limits (TTL)</text>

  <path d="M800 190 L478 318" class="ln" style="marker-start:url(#a)"/>
  <path d="M635 188 V292" class="ln" style="marker-start:url(#a)"/>
  <path d="M560 198 L440 300" class="ln" style="marker-start:url(#a)"/>
  <path d="M800 170 L748 318" class="ln" style="marker-start:url(#a)"/>

  <rect x="40" y="300" width="170" height="88" class="box aws"/>
  <text x="58" y="330" class="t">CloudWatch</text>
  <text x="58" y="352" class="s">logs (7 days), metrics of</text>
  <text x="58" y="370" class="s">all Lambdas; web alarm</text>

  <!-- Benchmark path -->
  <rect x="30" y="460" width="1130" height="230" class="grp"/>
  <text x="44" y="480" class="gt">Reproducible benchmark &amp; training (all heavy compute on Lambda)</text>

  <rect x="50" y="510" width="200" height="80" class="box"/>
  <text x="68" y="540" class="t">Driver (laptop)</text>
  <text x="68" y="562" class="s">plans, async fan-out,</text>
  <text x="68" y="578" class="s">merges JSON; times tool</text>

  <rect x="320" y="500" width="250" height="100" class="box cv"/>
  <text x="338" y="530" class="t">Lambda x132-bench</text>
  <text x="338" y="552" class="s">arm64 · 3008 MB · sharded jobs</text>
  <text x="338" y="570" class="s">generate · features · fit · tune(dev)</text>
  <text x="338" y="588" class="s">· eval(test)</text>

  <rect x="640" y="500" width="240" height="100" class="box cv"/>
  <text x="658" y="530" class="t">x132-tool (arm64 / x86_64)</text>
  <text x="658" y="552" class="s">same OpenCV 5 tool on two</text>
  <text x="658" y="570" class="s">architectures → latency</text>
  <text x="658" y="588" class="s">comparison (Graviton vs x86)</text>

  <rect x="940" y="500" width="200" height="100" class="box store"/>
  <text x="958" y="530" class="t">Data (licensed)</text>
  <text x="958" y="552" class="s">Poly Haven CC0 surfaces;</text>
  <text x="958" y="570" class="s">bench injects defects with</text>
  <text x="958" y="588" class="s">exact pixel ground truth</text>

  <path d="M250 550 H312" class="ln"/>
  <path d="M150 510 V494 H760 V498" class="ln dash"/>
  <path d="M1040 600 V616 H445 V606" class="ln dash"/>
  <path d="M540 500 L430 396" class="ln dash"/>

  <text x="50" y="636" class="s">Solid: request and data flow (two heads = read and write) · dashed: batch jobs and explanation · crossing lines do not connect.</text>
  <text x="50" y="660" class="s">Free-plan AWS account · scoped execution roles · no public bucket · no Marketplace products · teardown deletes recorded resources after ownership checks (versioned buckets: manual).</text>
</svg>
